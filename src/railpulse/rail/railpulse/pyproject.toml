[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "railpulse"
version = "0.1.0"
description = "RailPulse: shared platform, four specialist condition-monitoring pipelines"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "openpyxl",
    "joblib",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]
